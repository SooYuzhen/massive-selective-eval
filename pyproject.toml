[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "massive-selective-eval"
version = "1.0.0rc1"
description = "Multilingual Selective Prediction and Reliability Evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
predict = ["scikit-learn==1.7.2", "joblib>=1.3", "threadpoolctl>=3"]
encoder = ["sentence-transformers==5.6.1", "torch==2.13.0", "transformers==5.14.0"]
parquet = ["pyarrow>=15"]

[project.scripts]
massive-eval = "massive_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
